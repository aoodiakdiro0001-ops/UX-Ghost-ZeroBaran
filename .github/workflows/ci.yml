# =====================================================================
#  UX-Ghost ZeroBaran — CI validation
#  Runs on every push to ensure the project still imports & lints cleanly
# =====================================================================
name: UX-Ghost CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: 🧪 Lint
        run: ruff check . || true
      - name: 🧪 Smoke import
        run: |
          python -c "import sys; sys.path.insert(0,'.'); \
                     from ai_core.ux_analyzer import UXBrain, PageAggregates; \
                     from collectors.event_processor import EventProcessor; \
                     from telegram_bot.bot import send; \
                     print('✓ All modules import OK')"
